[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thrustmaster-controller"
version = "0.1.0"
description = "Discover and visualize live input from Thrustmaster USB controllers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mayaboker" }]
dependencies = ["pygame-ce>=2.5.3,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
thrustmaster-controller = "thrustmaster_controller.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thrustmaster_controller = ["assets/*.jpg"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
